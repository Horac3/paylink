# Tuned for ~4GB RAM VPS: conservative Postgres/Redis, capped Node heap, small static frontends.
# Set VITE_API_URL (and WEB_URL / MERCHANT_WEB_URL / DOCS_URL in paylink-backend/.env) to your public URLs.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=50
      -c effective_cache_size=192MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink_password
      POSTGRES_DB: paylink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./paylink-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://paylink:paylink_password@postgres:5432/paylink
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: production
      VIRTUAL_HOST: api.paylink.never9to5ive.com
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: api.paylink.never9to5ive.com
      LETSENCRYPT_EMAIL: your@email.com
    env_file:
      - ./paylink-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./paylink-backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    mem_limit: 512m
    networks:
      - nginx-proxy
      - default

  payment-web:
    build:
      context: ./paylink-payment-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.paylink.never9to5ive.com/api/v1}
        VITE_IOS_APP_URL: ${VITE_IOS_APP_URL:-https://apps.apple.com/app/paylink/id000000000}
        VITE_ANDROID_APP_URL: ${VITE_ANDROID_APP_URL:-https://play.google.com/store/apps/details?id=com.never9to5ive.paylink}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: pay.paylink.never9to5ive.com
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: pay.paylink.never9to5ive.com
      LETSENCRYPT_EMAIL: your@email.com
    mem_limit: 64m
    depends_on:
      - backend
    networks:
      - nginx-proxy
      - default

  merchant-web:
    build:
      context: ./paylink-merchant-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.paylink.never9to5ive.com/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-PayLink}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: merchant.paylink.never9to5ive.com
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: merchant.paylink.never9to5ive.com
      LETSENCRYPT_EMAIL: your@email.com
    mem_limit: 64m
    depends_on:
      - backend
    networks:
      - nginx-proxy
      - default

  docs:
    build:
      context: ./paylink-docs
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: docs.paylink.never9to5ive.com
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: docs.paylink.never9to5ive.com
      LETSENCRYPT_EMAIL: your@email.com
    mem_limit: 64m
    networks:
      - nginx-proxy
      - default

volumes:
  postgres_data:
  redis_data:

networks:
  nginx-proxy:
    external: true