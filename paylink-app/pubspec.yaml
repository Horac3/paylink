name: paylink_app
description: PayLink — Mobile Money Payment Orchestration for Malawi

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Biometrics
  local_auth: ^2.1.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1

  # Deep links
  app_links: ^6.3.2

  # QR scanner
  mobile_scanner: ^5.2.3

  # Charts
  fl_chart: ^0.68.0

  # PDF viewer
  flutter_pdfview: ^1.3.2

  # Environment
  flutter_dotenv: ^5.1.0

  # Freezed annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Connectivity
  connectivity_plus: ^6.0.5

  # Security
  flutter_jailbreak_detection: ^1.8.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  riverpod_generator: ^2.4.3
  retrofit_generator: ^8.1.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.11

  # Testing
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

  # Lints
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

fonts:
  - family: Inter
    fonts:
      - asset: assets/fonts/Inter-Regular.ttf
      - asset: assets/fonts/Inter-Medium.ttf
        weight: 500
      - asset: assets/fonts/Inter-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Inter-Bold.ttf
        weight: 700
